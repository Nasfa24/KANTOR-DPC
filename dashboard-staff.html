<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dasbor Staf - SuperApp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Animasi Radar GPS */
        .radar-box { position: relative; width: 80px; height: 80px; margin: 0 auto; display: none; }
        .radar-box.active { display: block; }
        .radar-core { width: 20px; height: 20px; background: #3b82f6; border-radius: 50%; position: absolute; top: 30px; left: 30px; z-index: 10; box-shadow: 0 0 10px #3b82f6; }
        .radar-ripple { width: 100%; height: 100%; border: 2px solid #3b82f6; border-radius: 50%; position: absolute; top: 0; left: 0; animation: ripple 1.5s infinite ease-out; }
        @keyframes ripple { 0% { transform: scale(0.2); opacity: 1; } 100% { transform: scale(1); opacity: 0; } }
        
        /* Hold to Confirm Button Styling */
        .hold-btn { position: relative; overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
        .hold-bg { position: absolute; left: 0; top: 0; height: 100%; width: 0%; background: #10b981; z-index: 0; }
        .hold-text { position: relative; z-index: 1; pointer-events: none; }
    </style>
</head>
<body class="p-4 pb-20">

    <!-- Header & Info Saldo -->
    <div class="glass-card p-6 mb-6 text-center relative overflow-hidden">
        <button onclick="logout()" class="absolute top-4 right-4 text-gray-400 hover:text-white">
            <i class="fa-solid fa-power-off text-xl"></i>
        </button>
        <p class="text-gray-300 text-sm mb-1">Selamat bekerja,</p>
        <h2 id="staffName" class="text-2xl font-bold mb-4 text-blue-400">Loading...</h2>
        
        <div class="bg-white/10 rounded-2xl p-4 border border-white/20">
            <p class="text-gray-300 text-xs uppercase tracking-widest mb-1">Sisa Kuota Makan</p>
            <h1 id="saldoStaff" class="text-4xl font-extrabold tracking-tight">Rp 0</h1>
        </div>
    </div>

    <!-- Modul Absensi (Geofencing) -->
    <div class="glass-card p-6 mb-6">
        <h3 class="text-lg font-bold mb-4 border-b border-white/20 pb-2"><i class="fa-solid fa-location-dot text-blue-400 mr-2"></i> Presensi Kehadiran</h3>
        
        <div id="radarContainer" class="radar-box mb-4">
            <div class="radar-ripple"></div>
            <div class="radar-core"></div>
        </div>
        <p id="gpsStatus" class="text-center text-sm text-gray-400 mb-4">Tekan tombol di bawah untuk memindai lokasi Anda.</p>

        <!-- Tombol Scan GPS -->
        <button id="btnScanGPS" onclick="scanLocation()" class="w-full bg-blue-600 hover:bg-blue-500 py-3 rounded-xl font-bold shadow-lg mb-2 transition-all">
            <i class="fa-solid fa-satellite-dish mr-2"></i> Pindai Lokasi GPS
        </button>

        <!-- Tombol Absen (Disembunyikan sampai GPS terkunci) -->
        <button id="btnAbsen" style="display: none;" 
                class="hold-btn w-full bg-gray-800 border border-emerald-500/30 py-4 rounded-xl font-bold shadow-lg"
                onmousedown="startHold(event, executeAbsen)" onmouseup="cancelHold(event)" onmouseleave="cancelHold(event)"
                ontouchstart="startHold(event, executeAbsen)" ontouchend="cancelHold(event)">
            <div class="hold-bg"></div>
            <span class="hold-text text-emerald-400"><i class="fa-solid fa-fingerprint mr-2"></i> Tahan untuk Absen</span>
        </button>
    </div>

    <!-- Modul Bayar UMKM -->
    <div class="glass-card p-6">
        <h3 class="text-lg font-bold mb-4 border-b border-white/20 pb-2"><i class="fa-solid fa-utensils text-orange-400 mr-2"></i> Beli Makan (UMKM)</h3>
        
        <div class="space-y-4">
            <!-- Dropdown Mitra -->
            <div>
                <label class="block text-xs text-gray-400 mb-1">Pilih Warung/Mitra</label>
                <select id="inputMitra" class="input-mobile text-left text-sm p-3">
                    <option value="" disabled selected>-- Pilih Tempat Makan --</option>
                    <!-- Idealnya ini ditarik dari API, tapi kita hardcode 1 sesuai data dummy untuk fase ini -->
                    <option value="M001">Warung Bu Ani (M001)</option>
                </select>
            </div>

            <!-- Input Nominal -->
            <div>
                <label class="block text-xs text-gray-400 mb-1">Nominal Jajan (Rp)</label>
                <input type="tel" id="inputNominal" class="input-mobile" placeholder="Contoh: 15000" autocomplete="off">
            </div>

            <!-- Tombol Bayar Hold-to-Confirm -->
            <button id="btnBayar" 
                    class="hold-btn w-full bg-gray-800 border border-orange-500/30 py-4 rounded-xl font-bold shadow-lg mt-4"
                    onmousedown="startHold(event, executeBayar)" onmouseup="cancelHold(event)" onmouseleave="cancelHold(event)"
                    ontouchstart="startHold(event, executeBayar)" ontouchend="cancelHold(event)">
                <div class="hold-bg" style="background: #f97316;"></div>
                <span class="hold-text text-orange-400"><i class="fa-solid fa-wallet mr-2"></i> Tahan untuk Bayar</span>
            </button>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        // 1. Inisialisasi Data User saat halaman dimuat
        const user = requireLogin();
        let userLat = null;
        let userLon = null;

        if (user) {
            document.getElementById('staffName').innerText = user.nama;
            document.getElementById('saldoStaff').innerText = formatRupiah(user.saldo);
        }

        // Format angka ke Rupiah
        function formatRupiah(angka) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);
        }

        // ==========================================
        // FITUR GEOFENCING (GPS RADAR)
        // ==========================================
        function scanLocation() {
            const status = document.getElementById('gpsStatus');
            const radar = document.getElementById('radarContainer');
            const btnScan = document.getElementById('btnScanGPS');
            const btnAbsen = document.getElementById('btnAbsen');

            if (!navigator.geolocation) {
                Swal.fire("Error", "Browser Anda tidak mendukung fitur GPS.", "error");
                return;
            }

            // Aktifkan UI Radar
            radar.classList.add('active');
            status.innerHTML = "<span class='text-blue-400 animate-pulse'>Mencari satelit GPS... Pastikan Anda di area terbuka.</span>";
            btnScan.style.display = 'none';

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    userLat = position.coords.latitude;
                    userLon = position.coords.longitude;
                    
                    radar.classList.remove('active');
                    status.innerHTML = `<span class='text-emerald-400'><i class='fa-solid fa-check-circle'></i> Lokasi terkunci. Akurasi: ${Math.round(position.coords.accuracy)} meter.</span>`;
                    
                    // Munculkan tombol Absen
                    btnAbsen.style.display = 'block';
                },
                (error) => {
                    radar.classList.remove('active');
                    btnScan.style.display = 'block';
                    let msg = "Gagal mengambil lokasi.";
                    if (error.code === 1) msg = "Akses GPS ditolak. Izinkan browser mengakses lokasi Anda.";
                    Swal.fire("GPS Gagal", msg, "error");
                    status.innerText = "Gagal memindai. Coba lagi.";
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

        // Eksekutor API Absensi
        async function executeAbsen() {
            try {
                const res = await callAPI("absen_masuk", {
                    id_user: user.id_user,
                    lat: userLat,
                    lon: userLon
                });
                
                // Animasi Sukses tidak flat
                Swal.fire({
                    icon: 'success',
                    title: 'Absen Diterima!',
                    text: `Jarak Anda: ${res.jarak} meter dari titik tengah kantor.`,
                    backdrop: `rgba(16, 185, 129, 0.4)`,
                    confirmButtonColor: '#10b981'
                });

                // Sembunyikan tombol absen agar tidak double click
                document.getElementById('btnAbsen').style.display = 'none';
                document.getElementById('gpsStatus').innerText = "Anda sudah absen hari ini.";

            } catch (err) {
                // Error (seperti: di luar radius 100m, atau sudah absen) ditangani otomatis oleh app.js
                document.getElementById('btnAbsen').style.display = 'none';
                document.getElementById('btnScanGPS').style.display = 'block'; // Suruh scan ulang jika mau coba lagi
                document.getElementById('gpsStatus').innerText = "Gagal. Silakan pindai ulang.";
            }
        }

        // ==========================================
        // FITUR BAYAR UMKM
        // ==========================================
        async function executeBayar() {
            const mitra = document.getElementById('inputMitra').value;
            const nominal = parseInt(document.getElementById('inputNominal').value);

            if (!mitra) return Swal.fire("Peringatan", "Pilih warung terlebih dahulu", "warning");
            if (!nominal || nominal <= 0) return Swal.fire("Peringatan", "Masukkan nominal yang valid", "warning");
            if (nominal > user.saldo) return Swal.fire("Saldo Kurang", "Sisa kuota makan Anda tidak mencukupi.", "error");

            try {
                const res = await callAPI("bayar_umkm", {
                    id_staff: user.id_user,
                    id_mitra: mitra,
                    nominal: nominal
                });

                // Update Saldo di memori & UI
                user.saldo = res.sisa_saldo;
                localStorage.setItem('userSession', JSON.stringify(user));
                
                // Animasi Rolling Number untuk Saldo
                document.getElementById('saldoStaff').innerText = formatRupiah(user.saldo);
                document.getElementById('inputNominal').value = ''; // Reset input

                Swal.fire({
                    icon: 'success',
                    title: 'Pembayaran Sukses!',
                    html: `Dana sebesar <b>${formatRupiah(nominal)}</b> telah dikirim.<br>Sisa kuota Anda: <b>${formatRupiah(user.saldo)}</b>`,
                    backdrop: `rgba(249, 115, 22, 0.4)`,
                    confirmButtonColor: '#f97316'
                });

            } catch (err) {
                // Error ditangani app.js
            }
        }

        // ==========================================
        // ENGINE: HOLD TO CONFIRM BUTTON
        // ==========================================
        let holdTimer;
        
        function startHold(e, actionCallback) {
            e.preventDefault(); // Cegah fungsi klik bawaan
            const btn = e.currentTarget;
            const bg = btn.querySelector('.hold-bg');
            
            // Animasi CSS berjalan selama 1.5 detik
            bg.style.transition = 'width 1.5s linear';
            bg.style.width = '100%';

            // Jika 1.5 detik terlampaui tanpa dilepas, eksekusi fungsi!
            holdTimer = setTimeout(() => {
                cancelHold(e); // Reset UI tombol
                actionCallback(); // Jalankan API (Absen/Bayar)
            }, 1500);
        }

        function cancelHold(e) {
            clearTimeout(holdTimer);
            const btn = e.currentTarget;
            const bg = btn.querySelector('.hold-bg');
            // Kembalikan lebar warna ke 0 dengan cepat
            bg.style.transition = 'width 0.2s ease-out';
            bg.style.width = '0%';
        }
    </script>
</body>
</html>
