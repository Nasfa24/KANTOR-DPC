<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Staf - SuperApp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="p-4 pb-20">

    <!-- Navbar Global -->
    <div class="flex justify-between items-center mb-4">
        <h1 class="font-black text-xl text-[var(--primary)]">Hi, <span id="staffName">Staf</span></h1>
        <div class="flex gap-2">
            <button onclick="window.location.reload()" class="w-10 h-10 rounded-full bg-[var(--yellow)] text-[var(--dark)] font-bold shadow-md active:scale-90 transition"><i class="fa-solid fa-rotate-right"></i></button>
            <button onclick="logout()" class="w-10 h-10 rounded-full bg-red-100 text-red-600 font-bold shadow-md active:scale-90 transition"><i class="fa-solid fa-power-off"></i></button>
        </div>
    </div>

    <!-- Info Saldo -->
    <div class="card-primary p-6 mb-6 text-center">
        <p class="text-[var(--yellow)] text-sm font-bold tracking-widest mb-1">SISA KUOTA MAKAN</p>
        <h1 id="saldoStaff" class="text-4xl font-black mb-2">Rp 0</h1>
    </div>

    <!-- Modul QR Jajan -->
    <div class="bg-white rounded-2xl p-6 mb-6 text-center border-2 border-[var(--primary)] shadow-lg">
        <h3 class="text-lg font-black mb-2 text-[var(--primary)]"><i class="fa-solid fa-qrcode text-[var(--orange)] mr-2"></i> QR Jajan UMKM</h3>
        <p class="text-xs text-gray-500 font-bold mb-4">Tunjukkan kode ini ke Mitra untuk bayar.</p>
        <div class="bg-white p-2 rounded-2xl inline-block shadow-inner mx-auto mb-2 border border-gray-200">
            <div id="qrcodeBox"></div>
        </div>
        <p id="qrIDLabel" class="text-sm font-black text-gray-400 tracking-widest mt-2"></p>
    </div>

    <!-- Modul GPS -->
    <div class="card-primary p-6">
        <h3 class="text-lg font-black mb-4 border-b border-white/20 pb-2"><i class="fa-solid fa-location-dot text-[var(--orange)] mr-2"></i> Presensi Kehadiran</h3>
        <div id="radarContainer" class="radar-box mb-4">
            <div class="radar-ripple"></div>
            <div class="radar-core"></div>
        </div>
        <p id="gpsStatus" class="text-center text-sm font-bold text-[var(--yellow)] mb-4">Pindai lokasi Anda untuk absen.</p>
        
        <button id="btnScanGPS" onclick="scanLocation()" class="btn-orange w-full py-4 text-lg shadow-lg mb-2"><i class="fa-solid fa-satellite-dish mr-2"></i> PINDAI LOKASI</button>
        
        <button id="btnAbsen" style="display: none;" 
                class="hold-btn w-full bg-gray-900 border-2 border-[var(--yellow)] py-4 rounded-xl font-bold shadow-lg"
                onmousedown="startHold(event, executeAbsen)" onmouseup="cancelHold(event)" onmouseleave="cancelHold(event)"
                ontouchstart="startHold(event, executeAbsen)" ontouchend="cancelHold(event)">
            <div class="hold-bg" style="background-color: var(--yellow);"></div>
            <span class="hold-text text-white"><i class="fa-solid fa-fingerprint mr-2"></i> Tahan untuk Absen</span>
        </button>
    </div>

    <script src="app.js"></script>
    <script>
        const user = requireLogin();
        let userLat = null, userLon = null;

        if (user) {
            document.getElementById('staffName').innerText = user.nama.split(" ")[0];
            document.getElementById('saldoStaff').innerText = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(user.saldo);
            document.getElementById('qrIDLabel').innerText = user.id_user;
            new QRCode(document.getElementById("qrcodeBox"), { text: user.id_user, width: 200, height: 200, colorDark: "#000000", colorLight: "#ffffff" });
        }

        function scanLocation() {
            const status = document.getElementById('gpsStatus'), radar = document.getElementById('radarContainer'), btnScan = document.getElementById('btnScanGPS'), btnAbsen = document.getElementById('btnAbsen');
            if (!navigator.geolocation) return Swal.fire("Error", "GPS tidak didukung", "error");
            radar.classList.add('active'); status.innerText = "Mencari satelit..."; btnScan.style.display = 'none';
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    userLat = pos.coords.latitude; userLon = pos.coords.longitude;
                    radar.classList.remove('active'); status.innerHTML = `<i class='fa-solid fa-check-circle'></i> Lokasi terkunci.`; btnAbsen.style.display = 'block';
                },
                (err) => { radar.classList.remove('active'); btnScan.style.display = 'block'; Swal.fire("GPS Gagal", "Gagal/ditolak.", "error"); status.innerText = "Gagal memindai."; },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

        async function executeAbsen() {
            try {
                await callAPI("absen_masuk", { id_user: user.id_user, lat: userLat, lon: userLon });
                Swal.fire({ icon: 'success', title: 'Absen Diterima!'});
                document.getElementById('btnAbsen').style.display = 'none'; document.getElementById('gpsStatus').innerText = "Sudah absen hari ini.";
            } catch (err) { document.getElementById('btnAbsen').style.display = 'none'; document.getElementById('btnScanGPS').style.display = 'block'; }
        }

        let holdTimer, activeHoldBg = null;
        function startHold(e, actionCallback) {
            e.preventDefault(); activeHoldBg = e.currentTarget.querySelector('.hold-bg'); 
            if(activeHoldBg) { activeHoldBg.style.transition = 'width 1.5s linear'; activeHoldBg.style.width = '100%'; 
                               e.currentTarget.querySelector('.hold-text').style.color = '#000'; }
            holdTimer = setTimeout(() => { actionCallback(); cancelHold(e); }, 1500);
        }
        function cancelHold(e) {
            clearTimeout(holdTimer); 
            if(activeHoldBg) { activeHoldBg.style.transition = 'width 0.2s ease-out'; activeHoldBg.style.width = '0%'; 
                               activeHoldBg.nextElementSibling.style.color = '#fff'; activeHoldBg = null; }
        }
    </script>
</body>
</html>
