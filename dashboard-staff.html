<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dasbor Staf - SuperApp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Tambahkan Library QR Code -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        .radar-box { position: relative; width: 80px; height: 80px; margin: 0 auto; display: none; }
        .radar-box.active { display: block; }
        .radar-core { width: 20px; height: 20px; background: #3b82f6; border-radius: 50%; position: absolute; top: 30px; left: 30px; z-index: 10; box-shadow: 0 0 10px #3b82f6; }
        .radar-ripple { width: 100%; height: 100%; border: 2px solid #3b82f6; border-radius: 50%; position: absolute; top: 0; left: 0; animation: ripple 1.5s infinite ease-out; }
        @keyframes ripple { 0% { transform: scale(0.2); opacity: 1; } 100% { transform: scale(1); opacity: 0; } }
        .hold-btn { position: relative; overflow: hidden; user-select: none; touch-action: manipulation; }
        .hold-bg { position: absolute; left: 0; top: 0; height: 100%; width: 0%; background: #10b981; z-index: 0; }
        .hold-text { position: relative; z-index: 1; pointer-events: none; }
    </style>
</head>
<body class="p-4 pb-20">

    <!-- Header & Info Saldo -->
    <div class="glass-card p-6 mb-6 text-center relative overflow-hidden">
        <button onclick="logout()" class="absolute top-4 right-4 text-gray-400 hover:text-white">
            <i class="fa-solid fa-power-off text-xl"></i>
        </button>
        <p class="text-gray-300 text-sm mb-1">Selamat bekerja,</p>
        <h2 id="staffName" class="text-2xl font-bold mb-4 text-blue-400">Loading...</h2>
        
        <div class="bg-white/10 rounded-2xl p-4 border border-white/20">
            <p class="text-gray-300 text-xs uppercase tracking-widest mb-1">Sisa Kuota Makan</p>
            <h1 id="saldoStaff" class="text-4xl font-extrabold tracking-tight">Rp 0</h1>
        </div>
    </div>

    <!-- Modul QR Code Pembayaran (BARU) -->
    <div class="glass-card p-6 mb-6 text-center">
        <h3 class="text-lg font-bold mb-4 text-orange-400"><i class="fa-solid fa-qrcode mr-2"></i> QR Jajan UMKM</h3>
        <p class="text-xs text-gray-300 mb-4">Tunjukkan kode ini kepada Mitra UMKM untuk di-scan saat Anda melakukan pembayaran.</p>
        
        <!-- Kotak Putih untuk QR agar kontras dan mudah di-scan kamera -->
        <div class="bg-white p-4 rounded-2xl inline-block shadow-lg mx-auto mb-2">
            <div id="qrcodeBox"></div>
        </div>
        <p id="qrIDLabel" class="text-sm font-mono text-gray-400 tracking-widest mt-2"></p>
        <button onclick="window.location.reload()" class="mt-4 text-xs text-blue-400 underline"><i class="fa-solid fa-rotate mr-1"></i> Refresh Saldo</button>
    </div>

    <!-- Modul Absensi (Geofencing) -->
    <div class="glass-card p-6">
        <h3 class="text-lg font-bold mb-4 border-b border-white/20 pb-2"><i class="fa-solid fa-location-dot text-blue-400 mr-2"></i> Presensi Kehadiran</h3>
        <div id="radarContainer" class="radar-box mb-4">
            <div class="radar-ripple"></div>
            <div class="radar-core"></div>
        </div>
        <p id="gpsStatus" class="text-center text-sm text-gray-400 mb-4">Pindai lokasi Anda untuk absen.</p>
        <button id="btnScanGPS" onclick="scanLocation()" class="w-full bg-blue-600 hover:bg-blue-500 py-3 rounded-xl font-bold shadow-lg mb-2">
            <i class="fa-solid fa-satellite-dish mr-2"></i> Pindai Lokasi GPS
        </button>
        <button id="btnAbsen" style="display: none;" 
                class="hold-btn w-full bg-gray-800 border border-emerald-500/30 py-4 rounded-xl font-bold shadow-lg"
                onmousedown="startHold(event, executeAbsen)" onmouseup="cancelHold(event)" onmouseleave="cancelHold(event)"
                ontouchstart="startHold(event, executeAbsen)" ontouchend="cancelHold(event)">
            <div class="hold-bg"></div>
            <span class="hold-text text-emerald-400"><i class="fa-solid fa-fingerprint mr-2"></i> Tahan untuk Absen</span>
        </button>
    </div>

    <script src="app.js"></script>
    <script>
        const user = requireLogin();
        let userLat = null, userLon = null;

        if (user) {
            document.getElementById('staffName').innerText = user.nama;
            document.getElementById('saldoStaff').innerText = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(user.saldo);
            
            // GENERATE QR CODE BERDASARKAN ID USER
            document.getElementById('qrIDLabel').innerText = user.id_user;
            new QRCode(document.getElementById("qrcodeBox"), {
                text: user.id_user, // Data yang akan dibaca kamera Mitra
                width: 180,
                height: 180,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });
        }

        // --- Logika GPS Absensi (Sama seperti sebelumnya) ---
        function scanLocation() {
            const status = document.getElementById('gpsStatus'), radar = document.getElementById('radarContainer'), btnScan = document.getElementById('btnScanGPS'), btnAbsen = document.getElementById('btnAbsen');
            if (!navigator.geolocation) return Swal.fire("Error", "GPS tidak didukung", "error");
            radar.classList.add('active'); status.innerHTML = "<span class='text-blue-400'>Mencari satelit...</span>"; btnScan.style.display = 'none';
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    userLat = pos.coords.latitude; userLon = pos.coords.longitude;
                    radar.classList.remove('active'); status.innerHTML = `<span class='text-emerald-400'><i class='fa-solid fa-check-circle'></i> Lokasi terkunci.</span>`; btnAbsen.style.display = 'block';
                },
                (err) => {
                    radar.classList.remove('active'); btnScan.style.display = 'block'; Swal.fire("GPS Gagal", "Gagal mengambil lokasi/ditolak.", "error"); status.innerText = "Gagal memindai.";
                }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

        async function executeAbsen() {
            try {
                const res = await callAPI("absen_masuk", { id_user: user.id_user, lat: userLat, lon: userLon });
                Swal.fire({ icon: 'success', title: 'Absen Diterima!', text: `Jarak: ${res.jarak}m.`, confirmButtonColor: '#10b981' });
                document.getElementById('btnAbsen').style.display = 'none'; document.getElementById('gpsStatus').innerText = "Sudah absen hari ini.";
            } catch (err) {
                document.getElementById('btnAbsen').style.display = 'none'; document.getElementById('btnScanGPS').style.display = 'block'; document.getElementById('gpsStatus').innerText = "Gagal. Pindai ulang.";
            }
        }

        let holdTimer;
        function startHold(e, actionCallback) {
            e.preventDefault(); const bg = e.currentTarget.querySelector('.hold-bg'); bg.style.transition = 'width 1.5s linear'; bg.style.width = '100%';
            holdTimer = setTimeout(() => { cancelHold(e); actionCallback(); }, 1500);
        }
        function cancelHold(e) {
            clearTimeout(holdTimer); const bg = e.currentTarget.querySelector('.hold-bg'); bg.style.transition = 'width 0.2s ease-out'; bg.style.width = '0%';
        }
    </script>
</body>
</html>
