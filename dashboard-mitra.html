<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kasir Mitra - SuperApp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        .hold-btn { position: relative; overflow: hidden; user-select: none; touch-action: manipulation; }
        .hold-bg { position: absolute; left: 0; top: 0; height: 100%; width: 0%; background: #f97316; z-index: 0; }
        .hold-text { position: relative; z-index: 1; pointer-events: none; }
        #reader { width: 100%; border-radius: 16px; overflow: hidden; border: 2px solid rgba(255,255,255,0.2) !important; }
        .tab-content { display: none; animation: fadeIn 0.3s ease-in-out; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="p-4 pb-20">

    <div class="glass-card p-6 mb-6 text-center relative overflow-hidden">
        <button onclick="logout()" class="absolute top-4 right-4 text-gray-400 hover:text-white">
            <i class="fa-solid fa-power-off text-xl"></i>
        </button>
        <p class="text-gray-300 text-sm mb-1">POS System Mitra,</p>
        <h2 id="mitraName" class="text-2xl font-bold mb-2 text-orange-400">Loading...</h2>
    </div>

    <!-- Navigasi -->
    <div class="flex gap-2 mb-6">
        <button onclick="switchTab('tab-kasir')" id="btn-tab-kasir" class="flex-1 py-3 rounded-xl font-bold text-sm bg-blue-600 text-white transition-all">
            <i class="fa-solid fa-qrcode mr-1"></i> Kasir
        </button>
        <button onclick="switchTab('tab-klaim')" id="btn-tab-klaim" class="flex-1 py-3 rounded-xl font-bold text-sm bg-white/10 text-gray-400 transition-all">
            <i class="fa-solid fa-money-bill-transfer mr-1"></i> Pencairan
        </button>
    </div>

    <!-- TAB 1: KASIR (SCAN QR) -->
    <div id="tab-kasir" class="tab-content active">
        <div class="glass-card p-6 mb-6 text-center">
            <h3 class="text-lg font-bold mb-4 border-b border-white/20 pb-2"><i class="fa-solid fa-camera text-blue-400 mr-2"></i> Scan QR Pelanggan</h3>
            <div id="reader" class="mb-4 hidden"></div>
            <button id="btnStartScan" onclick="startScanner()" class="w-full bg-blue-600 hover:bg-blue-500 py-4 rounded-xl font-bold shadow-lg">
                <i class="fa-solid fa-qrcode mr-2"></i> Buka Kamera Scanner
            </button>
            <button id="btnStopScan" onclick="stopScanner()" class="w-full bg-red-600 hover:bg-red-500 py-3 rounded-xl font-bold shadow-lg hidden">
                Tutup Kamera
            </button>
        </div>

        <div id="panelTagihan" class="glass-card p-6 hidden">
            <div class="bg-blue-900/50 p-4 rounded-xl border border-blue-500/30 mb-4 text-center">
                <p class="text-xs text-gray-400">Pelanggan Terdeteksi:</p>
                <h2 id="namaPelanggan" class="text-xl font-bold text-white mb-1">Nama</h2>
                <p class="text-sm">Saldo Maksimal: <span id="saldoPelanggan" class="font-bold text-emerald-400">Rp 0</span></p>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs text-gray-400 mb-1 text-center">Masukkan Nominal (Rp)</label>
                    <input type="tel" id="inputNominal" class="input-mobile !text-orange-400 !font-bold !text-2xl" placeholder="0" autocomplete="off">
                </div>
                <button class="hold-btn w-full bg-gray-800 border border-orange-500/30 py-4 rounded-xl font-bold shadow-lg mt-4"
                        onmousedown="startHold(event, executeTagihan)" onmouseup="cancelHold(event)" onmouseleave="cancelHold(event)"
                        ontouchstart="startHold(event, executeTagihan)" ontouchend="cancelHold(event)">
                    <div class="hold-bg"></div>
                    <span class="hold-text text-orange-400"><i class="fa-solid fa-file-invoice-dollar mr-2"></i> Tahan untuk Tagih</span>
                </button>
            </div>
        </div>
    </div>

    <!-- TAB 2: PENCAIRAN (KLAIM KE ADMIN) -->
    <div id="tab-klaim" class="tab-content">
        <div class="glass-card p-6 text-center">
            <h3 class="text-lg font-bold mb-4 border-b border-white/20 pb-2"><i class="fa-solid fa-wallet text-emerald-400 mr-2"></i> Dana Bisa Diklaim</h3>
            <p class="text-xs text-gray-400 mb-2">Total transaksi yang belum ditagihkan ke Kantor</p>
            <h1 id="totalUnclaimed" class="text-4xl font-black text-emerald-400 mb-6">Rp 0</h1>

            <button id="btnKlaim" class="hold-btn w-full bg-gray-800 border border-emerald-500/30 py-4 rounded-xl font-bold shadow-lg"
                    onmousedown="startHold(event, executeKlaimDana)" onmouseup="cancelHold(event)" onmouseleave="cancelHold(event)"
                    ontouchstart="startHold(event, executeKlaimDana)" ontouchend="cancelHold(event)">
                <div class="hold-bg" style="background: #10b981;"></div>
                <span class="hold-text text-emerald-400"><i class="fa-solid fa-paper-plane mr-2"></i> Tahan untuk Ajukan Pencairan</span>
            </button>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        const user = requireLogin();
        let html5QrcodeScanner;
        let scannedStaffID = null;
        let totalBisaDiklaim = 0;

        if (user) {
            document.getElementById('mitraName').innerText = user.nama;
            loadDataKlaim();
        }

        const formatRp = (angka) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR' }).format(angka);

        // -- TABS LOGIC --
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            if (tabId === 'tab-kasir') {
                document.getElementById('btn-tab-kasir').className = "flex-1 py-3 rounded-xl font-bold text-sm bg-blue-600 text-white transition-all";
                document.getElementById('btn-tab-klaim').className = "flex-1 py-3 rounded-xl font-bold text-sm bg-white/10 text-gray-400 transition-all";
            } else {
                document.getElementById('btn-tab-klaim').className = "flex-1 py-3 rounded-xl font-bold text-sm bg-blue-600 text-white transition-all";
                document.getElementById('btn-tab-kasir').className = "flex-1 py-3 rounded-xl font-bold text-sm bg-white/10 text-gray-400 transition-all";
                loadDataKlaim(); // Refresh data saat buka tab
            }
        }

        // -- DATA KLAIM LOGIC --
        async function loadDataKlaim() {
            try {
                const data = await callAPI("get_mitra_data", { id_mitra: user.id_user });
                totalBisaDiklaim = data.total_unclaimed;
                document.getElementById('totalUnclaimed').innerText = formatRp(totalBisaDiklaim);
                
                // Disable tombol jika 0
                const btnKlaim = document.getElementById('btnKlaim');
                if(totalBisaDiklaim === 0) {
                    btnKlaim.style.opacity = "0.5";
                    btnKlaim.style.pointerEvents = "none";
                } else {
                    btnKlaim.style.opacity = "1";
                    btnKlaim.style.pointerEvents = "auto";
                }
            } catch (err) { console.error("Gagal muat data mitra", err); }
        }

        async function executeKlaimDana() {
            if(totalBisaDiklaim === 0) return;
            try {
                await callAPI("klaim_mitra", { id_mitra: user.id_user });
                Swal.fire({
                    icon: 'success',
                    title: 'Tagihan Terkirim!',
                    text: `Tagihan sebesar ${formatRp(totalBisaDiklaim)} telah dikirim ke Kepala Kantor.`,
                    confirmButtonColor: '#10b981'
                });
                loadDataKlaim(); // Refresh angka ke 0
            } catch (err) {}
        }

        // -- KAMERA SCANNER LOGIC --
        function startScanner() {
            document.getElementById('reader').classList.remove('hidden');
            document.getElementById('btnStartScan').classList.add('hidden');
            document.getElementById('btnStopScan').classList.remove('hidden');
            document.getElementById('panelTagihan').classList.add('hidden'); 
            html5QrcodeScanner = new Html5Qrcode("reader");
            html5QrcodeScanner.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 250, height: 250 } }, onScanSuccess, (err)=>{})
            .catch(() => { Swal.fire("Kamera Gagal", "Izin kamera ditolak.", "error"); stopScanner(); });
        }
        function stopScanner() {
            if(html5QrcodeScanner) html5QrcodeScanner.stop().then(() => html5QrcodeScanner.clear());
            document.getElementById('reader').classList.add('hidden');
            document.getElementById('btnStartScan').classList.remove('hidden');
            document.getElementById('btnStopScan').classList.add('hidden');
        }
        async function onScanSuccess(decodedText) {
            stopScanner();
            try {
                const staffData = await callAPI("cek_staff", { qr_id: decodedText });
                scannedStaffID = staffData.id_user;
                document.getElementById('namaPelanggan').innerText = staffData.nama;
                document.getElementById('saldoPelanggan').innerText = formatRp(staffData.saldo);
                document.getElementById('panelTagihan').classList.remove('hidden');
                document.getElementById('inputNominal').value = '';
                new Audio('https://www.soundjay.com/buttons/sounds/beep-01a.mp3').play().catch(()=>{});
            } catch (error) { Swal.fire("QR Tidak Valid", "Kode QR tidak dikenali.", "error"); }
        }
        async function executeTagihan() {
            const nominal = parseInt(document.getElementById('inputNominal').value);
            if (!nominal || nominal <= 0) return Swal.fire("Peringatan", "Nominal tidak valid", "warning");
            try {
                await callAPI("bayar_umkm", { id_staff: scannedStaffID, id_mitra: user.id_user, nominal: nominal });
                Swal.fire({ icon: 'success', title: 'Sukses!', text: `Transaksi Rp ${nominal.toLocaleString('id-ID')} dicatat.`, confirmButtonColor: '#10b981' });
                document.getElementById('panelTagihan').classList.add('hidden'); scannedStaffID = null;
                loadDataKlaim(); // Update background data
            } catch (err) {}
        }

        // -- HOLD BUTTON ENGINE --
        let holdTimer;
        function startHold(e, actionCallback) {
            e.preventDefault(); const bg = e.currentTarget.querySelector('.hold-bg'); bg.style.transition = 'width 1.5s linear'; bg.style.width = '100%';
            holdTimer = setTimeout(() => { cancelHold(e); actionCallback(); }, 1500);
        }
        function cancelHold(e) {
            clearTimeout(holdTimer); const bg = e.currentTarget.querySelector('.hold-bg'); bg.style.transition = 'width 0.2s ease-out'; bg.style.width = '0%';
        }
    </script>
</body>
</html>
