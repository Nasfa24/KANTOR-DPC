<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mitra - SuperApp</title>
    <!-- PWA META TAGS -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#03754c">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3256/3256114.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>.tab-content { display: none; animation: fadeIn 0.3s; } .tab-content.active { display: block; } @keyframes fadeIn { from{opacity:0} to{opacity:1} }</style>
</head>
<body class="p-4 pb-20">

    <div class="flex justify-between items-center mb-4">
        <h1 class="font-black text-xl text-[var(--primary)]">Toko <span id="mitraName" class="text-[var(--orange)]">...</span></h1>
        <div class="flex gap-2">
            <div id="syncIndicator" class="w-3 h-3 rounded-full bg-green-500 my-auto shadow-[0_0_8px_#22c55e] opacity-0 transition-opacity"></div>
            <button onclick="refreshData()" class="w-10 h-10 rounded-full bg-[var(--yellow)] text-[var(--dark)] font-bold shadow-md active:scale-90 transition"><i id="iconRefresh" class="fa-solid fa-rotate-right"></i></button>
            <button onclick="logout()" class="w-10 h-10 rounded-full bg-red-100 text-red-600 font-bold shadow-md active:scale-90 transition"><i class="fa-solid fa-power-off"></i></button>
        </div>
    </div>

    <div class="flex gap-2 mb-4 bg-gray-100 p-1 rounded-2xl">
        <button onclick="switchTab('tab-kasir')" id="btn-tab-kasir" class="flex-1 py-3 rounded-xl font-bold text-sm bg-white shadow text-[var(--primary)] transition-all"><i class="fa-solid fa-qrcode mr-1"></i> Kasir</button>
        <button onclick="switchTab('tab-klaim')" id="btn-tab-klaim" class="flex-1 py-3 rounded-xl font-bold text-sm text-gray-400 transition-all"><i class="fa-solid fa-money-bill-transfer mr-1"></i> Penagihan</button>
    </div>

    <div id="tab-kasir" class="tab-content active">
        <div class="bg-white rounded-2xl p-6 mb-6 text-center border-2 border-[var(--primary)] shadow-lg">
            <h3 class="text-lg font-black mb-4"><i class="fa-solid fa-camera text-[var(--orange)] mr-2"></i> Scan QR Pembeli</h3>
            <div id="reader" class="mb-4 hidden"></div>
            <button id="btnStartScan" onclick="startScanner()" class="btn-orange w-full py-4 text-lg rounded-xl shadow-lg"><i class="fa-solid fa-qrcode mr-2"></i> BUKA KAMERA</button>
            <button id="btnStopScan" onclick="stopScanner()" class="w-full bg-red-600 text-white py-3 rounded-xl font-bold hidden">Tutup Kamera</button>
        </div>
        <div id="panelTagihan" class="card-primary p-6 hidden">
            <div class="bg-black/20 p-4 rounded-xl mb-4 text-center">
                <p class="text-xs text-[var(--yellow)] font-bold">Pelanggan Terdeteksi:</p>
                <h2 id="namaPelanggan" class="text-2xl font-black mb-1">Nama</h2>
                <p class="text-sm font-bold">Saldo: <span id="saldoPelanggan">Rp 0</span></p>
            </div>
            <div class="space-y-4">
                <div><label class="block text-xs font-bold mb-2 text-center text-[var(--yellow)]">Masukkan Tagihan (Rp)</label><input type="tel" id="inputNominal" class="input-mobile text-center font-black text-2xl" placeholder="0" autocomplete="off"></div>
                <button class="hold-btn w-full border-2 border-[var(--yellow)] py-4 rounded-xl font-bold shadow-lg" onmousedown="startHold(event, executeTagihan, 'var(--yellow)')" onmouseup="cancelHold(event)" onmouseleave="cancelHold(event)" ontouchstart="startHold(event, executeTagihan, 'var(--yellow)')" ontouchend="cancelHold(event)"><div class="hold-bg"></div><span class="hold-text text-[var(--yellow)]"><i class="fa-solid fa-check-double mr-2"></i> Tahan untuk Tagih</span></button>
            </div>
        </div>
    </div>

    <div id="tab-klaim" class="tab-content">
        <div class="card-primary p-6 text-center mb-6">
            <h3 class="text-lg font-black mb-2 text-[var(--yellow)]">Total Penagihan Aktif</h3>
            <h1 id="totalUnclaimed" class="text-4xl font-black mb-6">Rp 0</h1>
            <div class="bg-black/20 rounded-xl p-4 text-left mb-4">
                <p class="text-xs font-bold text-[var(--yellow)] mb-2"><i class="fa-solid fa-users"></i> Daftar Pembeli Hari Ini:</p>
                <ul id="listPembeli" class="text-sm font-bold space-y-1 h-32 overflow-y-auto pr-2"></ul>
            </div>
            <textarea id="chatMitra" class="input-mobile text-sm mb-4" rows="2" placeholder="Tulis pesan ke Kepala Kantor (Opsional)..."></textarea>
            <button id="btnKlaim" class="hold-btn w-full border-2 border-[var(--orange)] py-4 rounded-xl font-bold shadow-lg mb-6" onmousedown="startHold(event, executeKlaimDana, 'var(--orange)')" onmouseup="cancelHold(event)" onmouseleave="cancelHold(event)" ontouchstart="startHold(event, executeKlaimDana, 'var(--orange)')" ontouchend="cancelHold(event)"><div class="hold-bg"></div><span class="hold-text text-[var(--orange)]"><i class="fa-brands fa-whatsapp mr-2"></i> Buat Tagihan & Kirim WA</span></button>
            <div class="bg-white text-[var(--dark)] p-4 rounded-2xl shadow-inner mx-auto border-2 border-white/20">
                <p class="text-xs font-black mb-2">Tunjukkan QR ini ke Kepala Kantor saat menagih</p>
                <div id="qrMitraBox" class="flex justify-center mb-2"></div>
                <p id="qrMitraLabel" class="text-xs font-bold tracking-widest"></p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        const user = requireLogin();
        const formatRp = (angka) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR' }).format(angka);
        
        let html5QrcodeScanner, scannedStaffID = null, totalBisaDiklaim = 0, isProcessingQR = false;
        let rincianPembeli = [], noWaAdmin = "";

        if (user) {
            document.getElementById('mitraName').innerText = user.nama;
            document.getElementById('qrMitraLabel').innerText = user.id_user;
            new QRCode(document.getElementById("qrMitraBox"), { text: user.id_user, width: 180, height: 180, colorDark: "#000000", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M });
            refreshData(); 
            // AUTO REFRESH PER 2 MENIT (120000 ms)
            setInterval(silentSync, 120000); 
        }

        async function silentSync() { document.getElementById('syncIndicator').style.opacity = '1'; try { await loadDataKlaim(); } catch (err) {} setTimeout(() => document.getElementById('syncIndicator').style.opacity = '0', 1500); }
        async function refreshData() { document.getElementById('iconRefresh').classList.add('fa-spin'); await silentSync(); document.getElementById('iconRefresh').classList.remove('fa-spin'); }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            if (tabId === 'tab-kasir') { document.getElementById('btn-tab-kasir').className = "flex-1 py-3 rounded-xl font-bold text-sm bg-white shadow text-[var(--primary)] transition-all"; document.getElementById('btn-tab-klaim').className = "flex-1 py-3 rounded-xl font-bold text-sm text-gray-400 transition-all"; } 
            else { document.getElementById('btn-tab-klaim').className = "flex-1 py-3 rounded-xl font-bold text-sm bg-white shadow text-[var(--primary)] transition-all"; document.getElementById('btn-tab-kasir').className = "flex-1 py-3 rounded-xl font-bold text-sm text-gray-400 transition-all"; silentSync(); }
        }

        async function loadDataKlaim() {
            const data = await callAPI("get_mitra_data", { id_mitra: user.id_user });
            totalBisaDiklaim = data.total_unclaimed; rincianPembeli = data.rincian; noWaAdmin = data.no_wa_admin;
            document.getElementById('totalUnclaimed').innerText = formatRp(totalBisaDiklaim);
            const ul = document.getElementById('listPembeli');
            if(rincianPembeli.length === 0) ul.innerHTML = "<li class='text-gray-300 italic text-xs'>Belum ada transaksi hari ini</li>";
            else ul.innerHTML = rincianPembeli.map(r => `<li class="flex justify-between border-b border-white/20 pb-1"><span>${r.nama}</span> <span class="text-[var(--yellow)]">${formatRp(r.nominal)}</span></li>`).join('');
            const btn = document.getElementById('btnKlaim');
            if(totalBisaDiklaim === 0) { btn.style.opacity="0.5"; btn.style.pointerEvents="none"; } else { btn.style.opacity="1"; btn.style.pointerEvents="auto"; }
        }

        async function executeKlaimDana() {
            if(totalBisaDiklaim === 0) return;
            const pesan = document.getElementById('chatMitra').value;
            try {
                await callAPI("klaim_mitra", { id_mitra: user.id_user, catatan: pesan });
                let listTeks = rincianPembeli.map(r => `- ${r.nama} (${formatRp(r.nominal)})`).join('%0A');
                let teksWa = `Halo Kepala Kantor,%0AIni tagihan dari *${user.nama}*:%0A${listTeks}%0A*Total: ${formatRp(totalBisaDiklaim)}*%0ACatatan: ${pesan || '-'}`;
                let waFormat = noWaAdmin.toString(); if (waFormat.startsWith('0')) waFormat = '62' + waFormat.substring(1);
                Swal.fire({ icon: 'success', title: 'Tagihan Dibuat!', timer: 2000, showConfirmButton: false }).then(() => { window.open(`https://wa.me/${waFormat}?text=${teksWa}`, '_blank'); document.getElementById('chatMitra').value = ""; silentSync(); });
            } catch (err) {}
        }

        function startScanner() {
            document.getElementById('reader').classList.remove('hidden'); document.getElementById('btnStartScan').classList.add('hidden'); document.getElementById('btnStopScan').classList.remove('hidden'); document.getElementById('panelTagihan').classList.add('hidden'); 
            isProcessingQR = false; html5QrcodeScanner = new Html5Qrcode("reader");
            const boxSize = Math.min(250, window.innerWidth - 80); 
            html5QrcodeScanner.start({ facingMode: "environment" }, { fps: 20, qrbox: { width: boxSize, height: boxSize }, formatsToSupport: [ Html5QrcodeSupportedFormats.QR_CODE ] }, onScanSuccess, ()=>{}).catch(() => { Swal.fire("Error", "Izin kamera ditolak.", "error"); stopScanner(); });
        }

        async function stopScanner() {
            if(html5QrcodeScanner) { try { await html5QrcodeScanner.stop(); html5QrcodeScanner.clear(); } catch(e) {} html5QrcodeScanner = null; }
            document.getElementById('reader').classList.add('hidden'); document.getElementById('btnStartScan').classList.remove('hidden'); document.getElementById('btnStopScan').classList.add('hidden');
        }

        async function onScanSuccess(decodedText) {
            if(isProcessingQR) return; isProcessingQR = true; new Audio('https://www.soundjay.com/buttons/sounds/beep-01a.mp3').play().catch(()=>{});
            await stopScanner();
            try {
                const staff = await callAPI("cek_staff", { qr_id: decodedText });
                scannedStaffID = staff.id_user;
                document.getElementById('namaPelanggan').innerText = staff.nama; document.getElementById('saldoPelanggan').innerText = formatRp(staff.saldo);
                document.getElementById('panelTagihan').classList.remove('hidden'); document.getElementById('inputNominal').value = '';
            } catch (error) { isProcessingQR = false; }
        }

        async function executeTagihan() {
            const nom = parseInt(document.getElementById('inputNominal').value);
            if (!nom || nom <= 0) return Swal.fire("Peringatan", "Nominal salah", "warning");
            try { await callAPI("bayar_umkm", { id_staff: scannedStaffID, id_mitra: user.id_user, nominal: nom }); Swal.fire({ icon: 'success', title: 'Sukses!' }); document.getElementById('panelTagihan').classList.add('hidden'); silentSync(); } catch (err) {}
        }

        let holdTimer, activeHoldBg = null;
        function startHold(e, actionCallback, color) { e.preventDefault(); activeHoldBg = e.currentTarget.querySelector('.hold-bg'); if(activeHoldBg) { activeHoldBg.style.backgroundColor = color; activeHoldBg.style.transition = 'width 1.5s linear'; activeHoldBg.style.width = '100%'; e.currentTarget.querySelector('.hold-text').style.color = '#000'; } holdTimer = setTimeout(() => { actionCallback(); cancelHold(e); }, 1500); }
        function cancelHold(e) { clearTimeout(holdTimer); if(activeHoldBg) { activeHoldBg.style.transition = 'width 0.2s ease-out'; activeHoldBg.style.width = '0%'; activeHoldBg.nextElementSibling.style.color = activeHoldBg.style.backgroundColor; activeHoldBg = null; } }
    </script>
</body>
</html>
