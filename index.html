<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kantor DPC - Login</title>
    <!-- PWA META TAGS (Wajib untuk Install di HP) -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#03754c">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3256/3256114.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="flex items-center justify-center p-4 bg-gray-50 min-h-screen relative">

    <div class="card-primary w-full max-w-md p-8 text-center border-4 border-[var(--primary)] shadow-2xl relative" style="background-color: var(--light); color: var(--dark);">
        
        <div class="w-20 h-20 mx-auto rounded-full flex items-center justify-center mb-6 shadow-inner" style="background-color: var(--primary);">
            <i class="fa-solid fa-fingerprint text-4xl" style="color: var(--yellow);"></i>
        </div>

        <h1 class="text-3xl font-black mb-2 text-[var(--primary)]">Kantor DPC PKB Surabaya</h1>
        <p class="text-gray-500 mb-8 font-bold text-sm">Sistem Operasional Kantor</p>

        <form id="loginForm" class="space-y-6">
            <div><input type="text" id="inputID" required autocomplete="off" class="input-light uppercase text-center text-xl" placeholder="ID USER"></div>
            <div><input type="tel" id="inputPIN" required autocomplete="off" class="input-light text-center text-xl" placeholder="PIN RAHASIA"></div>
            <button type="submit" class="btn-orange w-full py-4 rounded-xl text-lg flex justify-center items-center gap-2 transition active:scale-95 shadow-lg">VERIFIKASI MASUK <i class="fa-solid fa-arrow-right"></i></button>
        </form>

        <!-- FITUR BARU: TOMBOL CLEAR CACHE TINGKAT DALAM -->
        <div class="mt-8 border-t border-gray-200 pt-4">
            <button type="button" onclick="hardClearCache()" class="text-xs font-bold text-gray-400 hover:text-red-500 transition-colors flex items-center justify-center w-full gap-2 mx-auto">
                <i class="fa-solid fa-broom"></i> Bersihkan Cache & Perbaiki Aplikasi
            </button>
        </div>

    </div>

    <script src="app.js"></script>
    <script>
        const existingSession = JSON.parse(localStorage.getItem('userSession'));
        if (existingSession) routeUser(existingSession.role);

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault(); 
            const idUser = document.getElementById('inputID').value.trim().toUpperCase();
            const pin = document.getElementById('inputPIN').value.trim();
            if(!idUser || !pin) return;

            try {
                const userData = await callAPI("login", { id_user: idUser, pin: pin });
                localStorage.setItem('userSession', JSON.stringify(userData));
                routeUser(userData.role);
            } catch (error) {}
        });

        function routeUser(role) {
            const cleanRole = role ? role.toString().trim().toUpperCase() : "";
            if (cleanRole === 'STAFF') window.location.href = 'dashboard-staff.html';
            else if (cleanRole === 'MITRA') window.location.href = 'dashboard-mitra.html';
            else if (cleanRole === 'SUPER_ADMIN') window.location.href = 'dashboard-admin.html';
            else Swal.fire('Error Hak Akses', `Role "${cleanRole}" tidak dikenali.`, 'error');
        }

        // ========================================================
        // ENGINE PEMBERSIH CACHE & SERVICE WORKER ABSOLUT
        // ========================================================
        async function hardClearCache() {
            const konfirmasi = await Swal.fire({
                title: 'Bersihkan Sistem?',
                text: "Fitur ini akan menghapus memori sisa, memperbarui sistem ke versi terbaru, dan menyegarkan aplikasi. Lanjutkan?",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: 'var(--primary)',
                cancelButtonColor: '#ef4444',
                confirmButtonText: 'Ya, Bersihkan!',
                cancelButtonText: 'Batal',
                customClass: { popup: 'rounded-3xl' }
            });

            if (konfirmasi.isConfirmed) {
                Swal.fire({ title: 'Memusnahkan Cache...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); }});

                try {
                    // 1. Hapus Storage Standar
                    localStorage.clear();
                    sessionStorage.clear();

                    // 2. Bunuh semua Service Worker (PWA Engine)
                    if ('serviceWorker' in navigator) {
                        const registrations = await navigator.serviceWorker.getRegistrations();
                        for (let registration of registrations) {
                            await registration.unregister();
                        }
                    }

                    // 3. Hancurkan Cache Storage (PWA Caches)
                    if ('caches' in window) {
                        const cacheNames = await caches.keys();
                        for (let cacheName of cacheNames) {
                            await caches.delete(cacheName);
                        }
                    }

                    // 4. Selesai dan Force Reload
                    Swal.fire({
                        icon: 'success', title: 'Sistem Segar!', text: 'Aplikasi berhasil diperbarui ke versi paling murni.', timer: 2000, showConfirmButton: false
                    }).then(() => {
                        window.location.reload(true); // Memaksa browser menarik file HTML baru dari server
                    });

                } catch (error) {
                    Swal.fire('Gagal', 'Terjadi kesalahan saat membersihkan sistem: ' + error.message, 'error');
                }
            }
        }
    </script>
</body>
</html>
