<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SuperApp Kantor - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="flex items-center justify-center p-4">

    <div class="glass-card w-full max-w-md p-8 text-center">
        <div class="w-20 h-20 mx-auto bg-blue-500 rounded-full flex items-center justify-center shadow-lg shadow-blue-500/50 mb-6">
            <i class="fa-solid fa-fingerprint text-4xl text-white"></i>
        </div>

        <h1 class="text-3xl font-bold mb-2">Login</h1>
        <p class="text-gray-400 mb-8 text-sm">Sistem Operasional Terpadu</p>

        <form id="loginForm" class="space-y-6">
            <div>
                <input type="text" id="inputID" required autocomplete="off" class="input-mobile uppercase" placeholder="ID USER (Cth: S001)">
            </div>
            <div>
                <input type="tel" id="inputPIN" required autocomplete="off" class="input-mobile" placeholder="PIN RAHASIA">
            </div>

            <button type="submit" class="btn-primary w-full py-4 rounded-xl text-lg font-bold uppercase tracking-wider flex justify-center items-center gap-2">
                Masuk Sistem <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>
    </div>

    <script src="app.js"></script>
    <script>
        const existingSession = JSON.parse(localStorage.getItem('userSession'));
        if (existingSession) routeUser(existingSession.role);

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault(); 
            const idUser = document.getElementById('inputID').value.trim().toUpperCase();
            const pin = document.getElementById('inputPIN').value.trim();
            if(!idUser || !pin) return;

            try {
                const userData = await callAPI("login", { id_user: idUser, pin: pin });
                localStorage.setItem('userSession', JSON.stringify(userData));
                
                Swal.fire({
                    icon: 'success',
                    title: `Selamat Datang, ${userData.nama}!`,
                    showConfirmButton: false,
                    timer: 1500,
                    timerProgressBar: true,
                    backdrop: `rgba(0,0,0,0.8)`
                }).then(() => routeUser(userData.role));
            } catch (error) { console.error("Login gagal", error); }
        });

        // ====================================================
        // BUG FIX: ROUTER ANTI-SPASI & DETEKSI ERROR OTOMATIS
        // ====================================================
        function routeUser(role) {
            // Memaksa format uppercase dan menghapus spasi gaib dari database
            const cleanRole = role ? role.toString().trim().toUpperCase() : "";
            
            if (cleanRole === 'STAFF') window.location.href = 'dashboard-staff.html';
            else if (cleanRole === 'MITRA') window.location.href = 'dashboard-mitra.html';
            else if (cleanRole === 'SUPER_ADMIN') window.location.href = 'dashboard-admin.html';
            else {
                // Jangan diam jika salah, tampilkan error agar admin tahu typo di Sheets-nya
                Swal.fire('Error Hak Akses', `Role "${cleanRole}" tidak dikenali sistem. Hubungi IT!`, 'error');
            }
        }
    </script>
</body>
</html>
